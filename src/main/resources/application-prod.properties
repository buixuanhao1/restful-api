# ============================================================
# PRODUCTION CONFIG — đặt các giá trị thực khi deploy
# Không commit file này lên git nếu chứa thông tin nhạy cảm
# ============================================================

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DB:jobhunter}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

hao.jwt.base64-secret=${JWT_SECRET:}
hao.jwt.access-token-validity-in-seconds=86400
hao.jwt.refresh-token-validity-in-seconds=604800

# Đường dẫn upload trên Linux server (thay bằng đường dẫn thực tế)
hao.upload-file.base-uri=file:///opt/jobhunter/upload/

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# CORS — điền domain production của bạn
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

logging.level.org.springframework.security=WARN
logging.level.root=WARN
